<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự kiện sắp diễn ra · EduHub Web</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html">EduHub Web</a>
        <nav class="site-nav" aria-label="Menu chính">
          <ul class="site-nav__list">
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="index.html" aria-current="page">Sự kiện</a></li>
            <li><a href="register.html">Đăng ký</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="container page">
      <h1>Sự kiện sắp diễn ra</h1>
      <form id="search-form" class="search-form">
        <label for="keyword">Tìm sự kiện</label>
        <input
          type="search"
          id="keyword"
          name="q"
          placeholder="Tìm sự kiện..."
        >
        <button type="submit" class="btn">Tìm</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="event-list" class="event-list">
        <!-- Card mẫu 1: Còn chỗ -->
        <article class="card">
          <img
            class="card__media"
            src="img/event.svg"
            alt="Workshop Git & GitHub cho tân sinh viên"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a
                href="event-detail.html?id=22222222-2222-4222-8222-000000000001"
              >
                Workshop Git &amp; GitHub cho tân sinh viên
              </a>
            </h2>
            <p class="card__info">
              <time datetime="2026-09-12T01:00:00.000Z">08:00, 12/09/2026</time>
            </p>
            <p class="card__location">Phòng máy A3.201</p>
            <p class="card__seats">Còn 12/40 chỗ</p>
          </div>
        </article>
        <!-- Card mẫu 2: Hết chỗ -->
        <article class="card">
          <img
            class="card__media"
            src="img/event.svg"
            alt="Hackathon EduHub 24 giờ"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a
                href="event-detail.html?id=22222222-2222-4222-8222-000000000004"
              >
                Hackathon EduHub 24 giờ
              </a>
            </h2>
            <p class="card__info">
              <time datetime="2026-12-19T01:00:00.000Z">08:00, 19/12/2026</time>
            </p>
            <p class="card__location">Phòng máy A3.205</p>
            <p class="card__seats">
              <span class="badge-full">Hết chỗ</span>
            </p>
          </div>
        </article>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 EduHub Web</p>
      </div>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
